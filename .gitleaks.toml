title = "agents-investing custom rules"

[extend]
useDefault = true

[[rules]]
id = "oci-public-ip"
description = "OCI 공인 IP — 커밋 금지, 별도 private repo 사용"
regex = '''134\.185\.110\.214|152\.67\.223\.37'''
tags = ["oci", "ip"]

[[rules]]
id = "oci-ocid-real"
description = "OCI 실 OCID (placeholder 제외)"
regex = '''ocid1\.(instance|tenancy|bastion|user|compartment|subnet|image)\.oc1\.[a-z]{2}-[a-z]+-\d+\.[a-z0-9]{20,}'''
tags = ["oci"]

[[rules]]
id = "oci-bastion-host"
description = "OCI bastion 호스트명"
regex = '''host\.bastion\.[a-z0-9-]+\.oci\.oraclecloud\.com'''
tags = ["oci"]

[[rules]]
id = "oci-server-hostname"
description = "운영 서버 호스트명"
regex = '''<OCI_HOSTNAME>'''
tags = ["oci"]

[allowlist]
description = "test fixture 의 가짜 시크릿은 정적 분석에서 제외"
paths = [
  '''test/.*\.py$''',
]

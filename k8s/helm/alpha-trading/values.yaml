# ── 글로벌 설정 ────────────────────────────────────────────────────────
namespace: alpha-trading

# 5 prod 서비스 (api / worker / tick-collector / db-init / db-init-migrate) 가
# 모두 같은 ghcr 이미지 'api' 를 공유 (entrypoint 만 다름). deploy 시 --set
# image.tag=<git-sha> 로 override. ui 는 별도 이미지 (ui.image 참조).
image:
  repository: ghcr.io/dongjus/alpha-financial-pipeline/api
  tag: latest
  pullPolicy: IfNotPresent

# GHCR private 패키지 — pull 자격증명. 운영자가 cluster 에 직접 docker-registry
# 타입 secret 으로 만들어야 함 (별도 작업).
imagePullSecrets:
  - name: ghcr-pull-secret

# ── 인프라 — Phase 6 마이그 완료. k3s 안 StatefulSet + PVC 단독 운영 ──
# enabled=true (default) → chart 의 StatefulSet + PVC 가 데이터 source.
# enabled=false → 외부 host-port (externalIP:externalPort) 를 가리키는
#                 Service + EndpointSlice 만 생성 (dual-run 시기 용).
infra:
  postgres:
    enabled: true
    host: postgres
    port: 5432
    externalIP: "10.0.0.248"   # enabled=false 일 때만 사용
    externalPort: 5432
    database: alpha_db
    user: alpha_user
    storage:
      storageClass: local-path
      size: 20Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits:   { cpu: 1,    memory: 1536Mi }
  redis:
    enabled: true
    host: redis
    port: 6379
    externalIP: "10.0.0.248"
    externalPort: 6379
    storage:
      storageClass: local-path
      size: 2Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 512Mi }
  # 운영 .env 의 S3_* 값들이 secret 으로 들어오므로 별도 host 키 X
  minio:                # 호환을 위해 남겨둠 (configmap _helpers 가 참조)
    host: minio
    port: 9000
    bucket: alpha-lake

# ── API 서버 ──────────────────────────────────────────────────────────
api:
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── Worker ────────────────────────────────────────────────────────────
worker:
  replicas: 1
  rlDataStorage: 5Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 3,    memory: 10Gi }
  hostPathMounts:
    enabled: true
    mounts:
      - name: gcloud-auth
        hostPath: /home/ubuntu/.config/gcloud
        mountPath: /root/.config/gcloud
        readOnly: true
      - name: claude-auth
        hostPath: /home/ubuntu/.claude
        mountPath: /root/.claude
        readOnly: false
      - name: codex-auth
        hostPath: /home/ubuntu/.codex
        mountPath: /root/.codex
        readOnly: false
  env:
    ORCH_MODE: blend
    ORCH_INTERVAL_SECONDS: "600"
    ORCH_RUN_ONCE: "false"
    ORCH_ENABLE_DAILY_REPORT: "false"
    ORCH_ENABLE_RL_AUTO_RETRAIN: "false"

# ── Tick Collector ────────────────────────────────────────────────────
tickCollector:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 5Gi }
  env:
    TICK_MARKET_HOURS_ONLY: "true"
    TICK_RECONNECT_MAX: "10"
  # KIS 실 계좌(real) vs 모의(paper) 토글.
  # chart default 를 "real" 로 명시 — G9 auto deploy (workflow_run trigger)
  # 시 kis_tick_mode input 이 default 라 --set 이 안 붙어 Infisical 값 (paper) 로
  # 리셋되던 문제 해소. 틱 데이터는 real KIS WebSocket 만 가능하므로 default 로 유지.
  # paper 로 돌리고 싶으면 workflow_dispatch 의 kis_tick_mode=paper.
  # (자본 리스크 0 — 거래는 worker, worker 는 여전히 Infisical 의 paper 값 따름.)
  kisTickMode: "real"   # "" / "real" / "paper". 빈 값 = Infisical 값 따름

# ── UI (nginx prod, 80 port) ───────────────────────────────────────────
# Phase 5d — cloudflared Quick Tunnel 이 노드의 NodePort 로 routing.
# 외부 트래픽: trycloudflare.com → cloudflared → host:30080 → ui pod:80
ui:
  enabled: true
  replicas: 1
  image: ghcr.io/dongjus/alpha-financial-pipeline/ui
  tag: latest
  port: 80
  serviceType: NodePort
  nodePort: 30080
  resources:
    requests: { cpu: 50m,  memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }

# ── DB migration ──────────────────────────────────────────────────────
# 외부 docker postgres 공유 시기 (infra.postgres.enabled=false) 에는 schema
# 가 이미 있으므로 기본값 false. k3s 안 postgres StatefulSet 운영으로 전환할
# 때 (Phase 6) 함께 true 로.
migration:
  enabled: false
  command:
    - /bin/bash
    - -c
    - |
      set -e
      echo "=== [1/4] Schema migration ==="
      python scripts/db/migrate_to_v2_instruments.py
      echo "=== [2/4] ohlcv_minute partitions ==="
      python scripts/db/migrate_ohlcv_minute.py
      echo "=== [3/4] Seed instruments ==="
      python scripts/db/seed_all_instruments.py --market KR --instruments-only
      echo "=== [4/4] Seed universe ==="
      python scripts/db/seed_trading_universe.py
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  backoffLimit: 2

# ── Ingress ───────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  host: alpha.local
  tls: false

# ── Secrets ───────────────────────────────────────────────────────────
# infisical.enabled=true 면 InfisicalStaticSecret CR 이 alpha-trading-secrets
# Secret 을 자동 생성. false (로컬/dev) 면 placeholder Secret 이 렌더링됨.
secrets: {}

# ── Infisical Kubernetes Operator 시크릿 동기화 ────────────────────────
# Operator (secrets-operator chart) 가 infisical-operator namespace 에 설치돼
# 있어야 함 (Phase 4 의 서버 작업).
infisical:
  enabled: true
  # cluster-internal 또는 외부 endpoint. Phase 5 cutover 시 docker compose 의
  # Infisical (80) 에서 k3s 의 Infisical (infisical namespace) 로 전환.
  address: "http://infisical.infisical.svc.cluster.local:8080"
  projectSlug: "alpha-financial-pipeline"
  environmentSlug: "prod"
  secretPath: "/"
  resyncInterval: "60s"

# ── PDB ───────────────────────────────────────────────────────────────
pdb:
  api:
    minAvailable: 1

{{- if .Values.infra.postgres.enabled }}
# k3s 안 postgres StatefulSet (단독 운영 모드)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.infra.postgres.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Values.infra.postgres.host }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "alpha-trading.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: {{ .Values.infra.postgres.port }}
              name: pg
          env:
            - name: POSTGRES_DB
              value: {{ .Values.infra.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.infra.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alpha-trading-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.infra.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.infra.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.infra.postgres.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.infra.postgres.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.postgres.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - port: {{ .Values.infra.postgres.port }}
      targetPort: {{ .Values.infra.postgres.port }}
      name: pg
  clusterIP: None  # headless — StatefulSet 의 stable DNS 를 위함
{{- else }}
# 외부 postgres (운영 docker compose 의 postgres 와 dual-run 공유) — Service +
# Endpoints 패턴. chart 의 다른 모든 컴포넌트는 hostname `{{ .Values.infra.postgres.host }}`
# 를 그대로 사용하지만 실제 트래픽은 노드 IP 의 host-port postgres 로 라우팅.
# Phase 5c (dual-run) 동안 사용. Phase 6 의 docker → k3s PVC 마이그레이션 후
# enabled=true 로 전환 + 본 Endpoints 자동 비활성.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.postgres.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-external
spec:
  ports:
    - port: {{ .Values.infra.postgres.port }}
      targetPort: {{ .Values.infra.postgres.externalPort | default .Values.infra.postgres.port }}
      name: pg
      protocol: TCP
  # Endpoints 를 우리가 직접 manage 하므로 selector 비움.
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.infra.postgres.host }}-external
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-external
    kubernetes.io/service-name: {{ .Values.infra.postgres.host }}
addressType: IPv4
endpoints:
  - addresses:
      - {{ required "infra.postgres.externalIP 필수 (enabled=false 일 때)" .Values.infra.postgres.externalIP | quote }}
    conditions:
      ready: true
ports:
  - name: pg
    port: {{ .Values.infra.postgres.externalPort | default .Values.infra.postgres.port }}
    protocol: TCP
{{- end }}

{{- if .Values.infisical.enabled }}
# Phase 4 — Infisical Kubernetes Operator 를 통해 운영 Infisical 인스턴스에서
# 시크릿을 자동 동기화. 결과로 k8s Secret `alpha-trading-secrets` 가 생성/
# 갱신되어 다른 templates (api/worker/tick-collector/db-init-migrate) 의
# envFrom secretRef 가 그대로 동작한다.
#
# 사전 셋업 (운영자 수행):
# 1. Infisical UI 에서 프로젝트 `{{ .Values.infisical.projectSlug }}` + 환경
#    `{{ .Values.infisical.environmentSlug }}` 가 존재해야 함.
# 2. Machine Identity (Universal Auth) 발급 → client ID + client secret.
# 3. k8s Secret 으로 등록:
#      kubectl -n {{ .Values.namespace }} create secret generic infisical-universal-auth \
#        --from-literal=clientId=<...> --from-literal=clientSecret=<...>
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: alpha-infisical
  namespace: {{ .Values.namespace }}
spec:
  address: {{ .Values.infisical.address | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: alpha-auth
  namespace: {{ .Values.namespace }}
spec:
  infisicalConnectionRef:
    name: alpha-infisical
  method: universal
  universal:
    secretsRef:
      name: infisical-universal-auth
      namespace: {{ .Values.namespace }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: alpha-secrets-sync
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: alpha-auth
  sources:
    - projectSlug: {{ .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug | quote }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  targets:
    - name: alpha-trading-secrets
      kind: Secret
      creationPolicy: Owner   # Operator 가 k8s Secret 의 owner
  resyncInterval: {{ .Values.infisical.resyncInterval | quote }}
{{- end }}

{{- if .Values.infisical.enabled }}
# Phase 4 — Infisical Kubernetes Operator (v0.11.2 v1beta1) 시크릿 동기화.
# k8s Secret `alpha-trading-secrets` 가 Operator 에 의해 자동 생성/갱신되어
# api/worker/tick-collector/db-init-migrate 의 envFrom secretRef 가 동작한다.
#
# v1beta1 CRD 필수 필드 — 구 v1alpha1 과 다름:
#   InfisicalConnection : spec.address
#   InfisicalAuth       : spec.infisicalConnectionRef.{name,namespace}
#                         spec.universal.clientIdRef.{key,name,namespace}
#                         spec.universal.clientSecretRef.{key,name,namespace}
#   InfisicalStaticSecret:
#                         spec.infisicalAuthRef.{name,namespace}
#                         spec.sources[].{environmentSlug,secretPath}
#                         spec.targets[].{name,namespace,kind,creationPolicy}
#                         spec.syncOptions.refreshInterval
#
# 사전 셋업 (자동화됨, Phase 5c 부트스트랩 스크립트가 수행):
#   kubectl -n {{ .Values.namespace }} create secret generic infisical-universal-auth \
#     --from-literal=clientId=<...> --from-literal=clientSecret=<...>
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalConnection
metadata:
  name: alpha-infisical
  namespace: {{ .Values.namespace }}
spec:
  address: {{ .Values.infisical.address | quote }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: alpha-auth
  namespace: {{ .Values.namespace }}
spec:
  infisicalConnectionRef:
    name: alpha-infisical
    namespace: {{ .Values.namespace }}
  method: universal
  universal:
    clientIdRef:
      name: infisical-universal-auth
      namespace: {{ .Values.namespace }}
      key: clientId
    clientSecretRef:
      name: infisical-universal-auth
      namespace: {{ .Values.namespace }}
      key: clientSecret
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: alpha-secrets-sync
  namespace: {{ .Values.namespace }}
spec:
  infisicalAuthRef:
    name: alpha-auth
    namespace: {{ .Values.namespace }}
  sources:
    - projectSlug: {{ .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ .Values.infisical.environmentSlug | quote }}
      secretPath: {{ .Values.infisical.secretPath | quote }}
  targets:
    - name: alpha-trading-secrets
      namespace: {{ .Values.namespace }}
      kind: Secret
      creationPolicy: Owner
  syncOptions:
    refreshInterval: {{ .Values.infisical.resyncInterval | quote }}
{{- end }}

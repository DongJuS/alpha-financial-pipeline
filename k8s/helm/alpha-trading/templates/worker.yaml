---
# RL 모델/실험 데이터 PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-rl-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.worker.rlDataStorage | default "5Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "alpha-trading.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "scripts/run_orchestrator_worker.py"]
          envFrom:
            - configMapRef:
                name: alpha-trading-config
            - secretRef:
                name: alpha-trading-secrets
          env:
            {{- include "alpha-trading.runtimeEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            # RL 정책/실험 아티팩트. RLPolicyStoreV2 · RLExperimentManager 가
            # 기대하는 코드 상 경로(`{repo_root}/artifacts/rl/…`)에 마운트한다.
            # 이전엔 `/data/rl/…` 로 잘못 마운트돼 파일은 컨테이너 ephemeral 층
            # 에만 쓰이고 재시작으로 유실 → DB record 만 남고 file 없음 → RLRunner
            # load_policy 실패.
            - name: rl-data
              mountPath: /app/artifacts/rl/models
              subPath: models
            - name: rl-data
              mountPath: /app/artifacts/rl/experiments
              subPath: experiments
            {{- if .Values.worker.hostPathMounts.enabled }}
            {{- range .Values.worker.hostPathMounts.mounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly | default false }}
            {{- end }}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.exit(0)"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from pathlib import Path; assert Path('/app/src').exists()"
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: rl-data
          persistentVolumeClaim:
            claimName: worker-rl-data
        {{- if .Values.worker.hostPathMounts.enabled }}
        {{- range .Values.worker.hostPathMounts.mounts }}
        - name: {{ .name }}
          hostPath:
            path: {{ .hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- end }}

{{- if .Values.infra.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.infra.redis.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ .Values.infra.redis.host }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "alpha-trading.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: {{ .Values.infra.redis.port }}
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.infra.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.infra.redis.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.infra.redis.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.redis.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/component: redis
  ports:
    - port: {{ .Values.infra.redis.port }}
      targetPort: {{ .Values.infra.redis.port }}
      name: redis
  clusterIP: None
{{- else }}
# 외부 redis (운영 docker compose 의 redis 와 dual-run 공유).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.infra.redis.host }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-external
spec:
  ports:
    - port: {{ .Values.infra.redis.port }}
      targetPort: {{ .Values.infra.redis.externalPort | default .Values.infra.redis.port }}
      name: redis
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Values.infra.redis.host }}-external
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-external
    kubernetes.io/service-name: {{ .Values.infra.redis.host }}
addressType: IPv4
endpoints:
  - addresses:
      - {{ required "infra.redis.externalIP 필수 (enabled=false 일 때)" .Values.infra.redis.externalIP | quote }}
    conditions:
      ready: true
ports:
  - name: redis
    port: {{ .Values.infra.redis.externalPort | default .Values.infra.redis.port }}
    protocol: TCP
{{- end }}

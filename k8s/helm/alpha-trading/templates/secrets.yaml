{{- if not .Values.infisical.enabled }}
# Infisical Operator 비활성 시 placeholder Secret. 운영 deploy 시
# --set 또는 -f override-secrets.yaml 로 값 주입. 평문 commit 금지.
# 운영 환경 (.Values.infisical.enabled=true) 에서는 본 매니페스트가 렌더링
# 안 되고, InfisicalStaticSecret CR 이 같은 이름의 Secret 을 자동 생성한다.
apiVersion: v1
kind: Secret
metadata:
  name: alpha-trading-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwt_secret | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres_password | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3_access_key | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3_secret_key | default "" | quote }}
  KIS_APP_KEY: {{ .Values.secrets.kis_app_key | default "" | quote }}
  KIS_APP_SECRET: {{ .Values.secrets.kis_app_secret | default "" | quote }}
  KIS_ACCOUNT_NUMBER: {{ .Values.secrets.kis_account_number | default "" | quote }}
  KIS_IS_PAPER_TRADING: {{ .Values.secrets.kis_is_paper_trading | default "true" | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegram_bot_token | default "" | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.secrets.telegram_chat_id | default "" | quote }}
{{- end }}

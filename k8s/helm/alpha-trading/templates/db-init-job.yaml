{{- if .Values.migration.enabled }}
# db-init-migrate Job — 매 release revision 마다 새 Job.
# 이전 hook 방식은 ConfigMap/Secret 보다 먼저 적용 → 'configmap not found' fail.
# 일반 매니페스트로 두면 helm 이 의존성 순서대로 적용 (ConfigMap → Job).
# Job 이름에 .Release.Revision 포함 → 매 upgrade 마다 새 Job (Job spec 은
# immutable selector). 옛 Job 은 ttlSecondsAfterFinished 로 1 시간 후 자동 삭제.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-migrate-r{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alpha-trading.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-init-migrate
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "alpha-trading.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-init-migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: db-init-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migration.command | nindent 12 }}
          envFrom:
            - configMapRef:
                name: alpha-trading-config
            - secretRef:
                name: alpha-trading-secrets
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
{{- end }}

# ================================================================
# Deploy Pipeline — K3s helm 배포
#
# 트리거 정책:
#   - workflow_dispatch : 수동 (image_tag / kis_tick_mode override 가능)
#   - workflow_run      : build-and-push 가 main 에서 성공한 직후 자동 트리거.
#                         G9 (자동 트리거 활성) — main push 마다 build →
#                         GHCR push → 자동 deploy. main 머지가 곧 운영 배포.
#
# 안전망:
#   - environment: production (시크릿 scope, branch protection 통과 main 만)
#   - helm --atomic --wait --timeout 10m (fail 시 자동 rollback)
#   - concurrency: deploy-k3s (동시 배포 충돌 방지, cancel-in-progress=false 라
#                  앞 배포가 끝날 때까지 대기 — 중간 단계 cutover 보호)
# ================================================================
name: Deploy to K3s

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 SHA (비우면 현재 main HEAD)"
        required: false
        default: ""
      kis_tick_mode:
        description: "tick-collector 의 KIS 모드 (default=Infisical 값 그대로 / real=실 계좌 WebSocket / paper=모의)"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - real
          - paper
  workflow_run:
    workflows: ["build-and-push"]   # name: 키와 매칭
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

jobs:
  deploy:
    name: helm upgrade on k3s
    runs-on: ubuntu-latest
    environment: production
    # workflow_run 으로 트리거된 경우엔 build 가 성공한 것만 진행 (실패한 build
    # 의 image 가 GHCR 에 없으니 pull 자체가 fail). workflow_dispatch 는 무조건.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Resolve image tag
        id: tag
        # workflow_run 트리거 시 github.sha 는 workflow file 의 default branch HEAD
        # 이라 build 가 만든 image tag 와 다를 수 있음. workflow_run.head_sha 가
        # build 가 실제로 본 commit. workflow_dispatch 의 image_tag input 이 있으면
        # 그게 우선 (수동 rollback / 특정 SHA 배포).
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}

      - name: Register OCI server host key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Helm upgrade on k3s
        id: deploy
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          KIS_TICK_MODE: ${{ github.event.inputs.kis_tick_mode }}
        run: |
          set -o pipefail
          # kisTickMode 가 'default' 면 chart 의 빈 값 그대로 (Infisical 값
          # 따름). real/paper 면 --set 으로 override → KIS_IS_PAPER_TRADING
          # env 가 tick-collector 에만 추가됨.
          EXTRA_SETS=""
          if [ "$KIS_TICK_MODE" = "real" ] || [ "$KIS_TICK_MODE" = "paper" ]; then
            EXTRA_SETS="--set tickCollector.kisTickMode=$KIS_TICK_MODE"
          fi
          # ServerAliveInterval/CountMax — helm install --wait 가 10분 가까이
          # 걸릴 수 있고 그 동안 SSH stdout 이 침묵 → OCI 경로의 NAT/방화벽이
          # idle TCP 를 끊으면 'client_loop: send disconnect: Broken pipe' 가
          # 발생. keepalive 로 연결 유지. (infisical repo PR #9 와 동일 조치)
          ssh -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              ${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_SSH_HOST }} \
              "cd /home/ubuntu/alpha-financial-pipeline && \
               git fetch origin main --quiet && \
               git reset --hard '$IMAGE_TAG' && \
               helm upgrade --install alpha-trading k8s/helm/alpha-trading \
                 --namespace alpha-trading --create-namespace \
                 --set image.tag='$IMAGE_TAG' \
                 --set ui.tag='$IMAGE_TAG' \
                 $EXTRA_SETS \
                 --atomic --wait --timeout 10m && \
               kubectl -n alpha-trading get pods" 2>&1 | tee /tmp/deploy-output.log

      - name: Telegram 알림 — 성공
        if: success() && env.TELEGRAM_BOT_TOKEN_DEPLOY != ''
        env:
          TELEGRAM_BOT_TOKEN_DEPLOY: ${{ secrets.TELEGRAM_BOT_TOKEN_DEPLOY }}
          TELEGRAM_CHAT_ID_DEPLOY: ${{ secrets.TELEGRAM_CHAT_ID_DEPLOY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN_DEPLOY}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID_DEPLOY}" \
            -d text="[k3s deploy] OK ${IMAGE_TAG:0:7} — $(date -u +%FT%TZ)" || true

      - name: Telegram 알림 — 실패
        if: failure() && env.TELEGRAM_BOT_TOKEN_DEPLOY != ''
        env:
          TELEGRAM_BOT_TOKEN_DEPLOY: ${{ secrets.TELEGRAM_BOT_TOKEN_DEPLOY }}
          TELEGRAM_CHAT_ID_DEPLOY: ${{ secrets.TELEGRAM_CHAT_ID_DEPLOY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN_DEPLOY}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID_DEPLOY}" \
            -d text="[k3s deploy] FAIL ${IMAGE_TAG:0:7} — helm upgrade 실패" || true

      - name: Archive run result to OCI Object Storage
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_BACKUP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_BACKUP_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          OCI_BACKUP_ENDPOINT: ${{ secrets.OCI_BACKUP_ENDPOINT }}
          OCI_BACKUP_BUCKET: ${{ secrets.OCI_BACKUP_BUCKET }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/gha-archive
          cat > /tmp/gha-archive/result.json <<EOF
          {
            "repo": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "run_attempt": ${{ github.run_attempt }},
            "image_tag": "$IMAGE_TAG",
            "status": "$JOB_STATUS",
            "actor": "${{ github.actor }}",
            "event": "${{ github.event_name }}",
            "timestamp": "$(date -u +%FT%TZ)",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          [ -f /tmp/deploy-output.log ] && cp /tmp/deploy-output.log /tmp/gha-archive/deploy-output.log
          tar -czf /tmp/gha-archive.tar.gz -C /tmp/gha-archive .
          KEY="alpha/gha/deploy-k3s/$(date -u +%Y/%m/%d)/${{ github.run_id }}-attempt${{ github.run_attempt }}.tar.gz"
          aws --endpoint-url "$OCI_BACKUP_ENDPOINT" --region "${OCI_BACKUP_REGION:-ap-chuncheon-1}" \
              s3 cp /tmp/gha-archive.tar.gz "s3://$OCI_BACKUP_BUCKET/$KEY" \
              --no-progress
          echo "archived → s3://$OCI_BACKUP_BUCKET/$KEY"
